    // ===== Persistent Segment Queue (additions; non-destructive) =====
    const STORAGE_KEY_QUEUE   = "screensaver.queue.v1";
    const STORAGE_KEY_INDEX   = "screensaver.index.v1";
    const STORAGE_KEY_CONFIG  = "screensaver.config.v1";

    function normalizeList(list) {
        return list.map(v => {
            const hours = v.hours ?? v.hour ?? 0;
            const minutes = v.minutes ?? 0;
            const seconds = v.seconds ?? 0;
            const skip = v.skip ?? 0;
            return { id: v.id, title: v.title ?? v.id, hours, minutes, seconds, skip, live: !!v.live };
        });
    }

    function secondsOf(v) {
        if (v.live) return 12 * Hour;
        return (v.hours * Hour) + (v.minutes * Minute) + v.seconds;
    }

    function shuffleInPlace(a) {
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function currentConfigSignature(videos, segmentSec) {
        const deterministic = normalizeList(videos).filter(v => !v.live)
            .map(v => ({id:v.id, title:v.title, hours:v.hours, minutes:v.minutes, seconds:v.seconds, skip:v.skip}));
        return JSON.stringify({ duration: segmentSec, videos: deterministic });
    }

    function buildSegments(videos, segmentSec) {
        const segments = [];
        const safety = 30;
        const norm = normalizeList(videos);
        for (const v of norm) {
            if (v.live) continue;
            const total = secondsOf(v);
            const skip = v.skip || 0;
            if (total <= skip + segmentSec + safety) {
                segments.push({ id: v.id, title: v.title, start: skip, total, segment: segmentSec });
                continue;
            }
            for (let start = skip; start <= total - segmentSec - safety; start += segmentSec) {
                segments.push({ id: v.id, title: v.title, start, total, segment: segmentSec });
            }
            const finalStart = Math.max(skip, total - segmentSec - safety);
            if (!segments.some(s => s.id === v.id && s.start === finalStart)) {
                segments.push({ id: v.id, title: v.title, start: finalStart, total, segment: segmentSec });
            }
        }
        return segments;
    }

    function loadQueue() {
        const q = localStorage.getItem(STORAGE_KEY_QUEUE);
        const i = localStorage.getItem(STORAGE_KEY_INDEX);
        const c = localStorage.getItem(STORAGE_KEY_CONFIG);
        return {
            queue: q ? JSON.parse(q) : null,
            index: i ? parseInt(i, 10) : 0,
            config: c || null,
        };
    }

    function saveQueue(queue, index, configSig) {
        localStorage.setItem(STORAGE_KEY_QUEUE, JSON.stringify(queue));
        localStorage.setItem(STORAGE_KEY_INDEX, String(index));
        localStorage.setItem(STORAGE_KEY_CONFIG, configSig);
    }

    function ensureQueue(videos, segmentSec) {
        const sig = currentConfigSignature(videos, segmentSec);
        const { queue, index, config } = loadQueue();
        if (!queue || !config || config !== sig) {
            const segments = buildSegments(videos, segmentSec);
            shuffleInPlace(segments);
            saveQueue(segments, 0, sig);
            return { queue: segments, index: 0, config: sig };
        } else {
            return { queue, index: Math.min(index, queue.length - 1), config: sig };
        }
    }

    function advanceIndex(index, queueLength) {
        const next = index + 1;
        if (next < queueLength) return next;
        const q = JSON.parse(localStorage.getItem(STORAGE_KEY_QUEUE));
        shuffleInPlace(q);
        localStorage.setItem(STORAGE_KEY_QUEUE, JSON.stringify(q));
        return 0;
    }

    // Initialize STATE with a persisted queue (built from current videos + duration)
    let STATE = ensureQueue(videos, duration);
    let lastVideo = -1;
    let switching = -1;

    function init() {
        updateTime();
    }

    // Shuffle the video order
    for (let i = videos.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [videos[i], videos[j]] = [videos[j], videos[i]];
    }

    let videoIndex = 0;

        // -- Queue-backed deterministic segment rotation --
        // Preserve old random logic below (commented) for reference.

        // Ensure queue is up to date in case videos or duration changed
        const currentSig = currentConfigSignature(videos, duration);
        if (STATE.config !== currentSig) {
            STATE = ensureQueue(videos, duration);
        }

        const q = STATE.queue;
        if (!q || q.length === 0) {
            display.innerHTML = 'No segments available.';
            return;
        }
        const seg = q[STATE.index];

        const host = NoCookie ? 'www.youtube-nocookie.com' : 'www.youtube.com';
        const url = `https://${host}/embed/${seg.id}?autoplay=1&mute=1&controls=0&start=${Math.max(0, Math.floor(seg.start))}`;

        player.src = url;

        const beginMin = Math.round(seg.start / 60);
        const lengthMin = Math.round(seg.total / 60);

        // Update progress UI
        if (RelativeProgress) {

            progressBar.style.width = `100%`;
        }

        // Flip progress bar anchor each time (top/bottom)
        if (progressContainer.classList.contains('top')) {
            progressContainer.classList.add('bottom');
            progressContainer.classList.remove('top');
        } else {
            progressContainer.classList.add('top');
            progressContainer.classList.remove('bottom');
        }

        if (doSwitch) switching = 0;

        // Advance pointer and persist
        STATE.index = advanceIndex(STATE.index, q.length);
        saveQueue(STATE.queue, STATE.index, STATE.config);

        if (doSwitch) switching = 0;

        // Update progress
        if (RelativeProgress) {

            const durationPercentage = (duration / totalSeconds) * 100;

        }
        progressAmount.style.width = '0';
        if (progressContainer.classList.contains('top')) {

        } else {
            progressContainer.classList.add('top');

        }
        ---- End previous logic ---- */
    }

    function updateTime() {
        const now = new Date();

        // Update progress
        const progress = now.getTime() - lastVideo;
        const progressPercentage = (progress / (duration * 1000)) * 100;
        progressAmount.style.width = `${progressPercentage}%`;

        if (switching === 5) {
            // Start transitioning
            current.classList.add('fadeOutPlayer');
            next.classList.add('fadeInPlayer');
            next.classList.remove('hidden');
        } else if (switching === 11) {
            // Finish transitioning
            current.src = 'about:blank';
            current.classList.add('hidden');
            current.classList.remove('fadeOutPlayer');
            next.classList.remove('fadeInPlayer');

            let p = next;
            next = current;
            current = p;
            switching = -1;
        }
        if (switching !== -1) {
            switching += 1;
        }

        if (lastVideo === -1) {
            nextVideo(false);
            lastVideo = now.getTime();
        } else if (now.getTime() - lastVideo > duration * 1000) {
            // Change video
            const switchPlayers = TwoPlayers;
            nextVideo(switchPlayers);
            lastVideo = now.getTime();

            if (clock.classList.contains("topLeft")) {
                clock.classList.remove("topLeft");
                clock.classList.add("topRight");
            } else if (clock.classList.contains("topRight")) {
                clock.classList.remove("topRight");
                clock.classList.add("bottomLeft");
                display.classList.remove("bottom");
                display.classList.add("top");
            } else if (clock.classList.contains("bottomLeft")) {
                clock.classList.remove("bottomLeft");
                clock.classList.add("bottomRight");
            } else if (clock.classList.contains("bottomRight")) {
                clock.classList.remove("bottomRight");
                clock.classList.add("topLeft");
                display.classList.remove("top");
                display.classList.add("bottom");
            }
        }

        now.getDay()

        const day = Days[now.getDay()];
        const month = Months[now.getMonth()];
        const dayInMonth = now.getDate();
        const year = now.getFullYear();

        let h = now.getHours();
        let m = now.getMinutes();
        let s = now.getSeconds();
        let amPm = 'am';
        if (h > 12) {
            h -= 12;
            amPm = 'pm';
        } else if (h === 0) {
            h = 12;
        }
        m = checkTime(m);
        s = checkTime(s);
        date.innerHTML = `${day}, ${month} ${dayInMonth}, ${year}`;
        time.innerHTML =  h + ":" + m + ":" + s + ' ' + amPm;
        setTimeout(updateTime, 1000);
    }

    function checkTime(i) {
